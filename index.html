<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>平方数の和</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script defer src="scene.js"></script>
    <script defer src="packing.js"></script>
    <script defer src="square.js"></script>
</head>
<body class="square-page">
    <header class="site-header">
        <div class="header-inner">
            <nav aria-label="教材">
                <a href="index.html" aria-current="page">平方数の和</a>
                <a href="vectors.html" target="_blank" rel="noopener" aria-label="３次元のベクトルの合成（別タブ）">３次元のベクトルの合成</a>
            </nav>
        </div>
    </header>

    <main class="shell">
        <div class="page-heading">
            <h1>平方数の和</h1>
        </div>
        <div class="workspace">
            <section class="stage" aria-labelledby="view-title">
                <header class="stage-header">
                    <h2 id="view-title"><span class="view-icon" aria-hidden="true"></span>3Dビュー</h2>
                    <div class="stage-actions">
                        <button class="quiet-button" id="reset-view" type="button">視点を戻す</button>
                        <button class="primary-button" id="play" type="button"><span class="play-icon" aria-hidden="true"></span><span id="play-label">組み立てる</span></button>
                    </div>
                </header>
                <div id="viewport" class="viewport" aria-label="平方数の和の3Dモデル">
                    <p class="scene-message" id="scene-message" role="status">3Dモデルを読み込み中</p>
                </div>
                <footer class="stage-footer">
                    <span class="view-state" id="view-state" role="status">分解</span>
                    <span class="view-hint">ドラッグで回転 · スクロール／ピンチで拡大</span>
                </footer>
            </section>

            <aside class="panel" aria-label="3Dモデルの操作">
                <section class="panel-section">
                    <h2 id="size-title">段数 <var>n</var></h2>
                    <div class="choices size-choices" role="group" aria-labelledby="size-title" id="size-choices">
                        <button type="button" data-size="1" aria-pressed="false">1</button>
                        <button type="button" data-size="2" aria-pressed="false">2</button>
                        <button type="button" data-size="3" aria-pressed="true">3</button>
                        <button type="button" data-size="4" aria-pressed="false">4</button>
                        <button type="button" data-size="5" aria-pressed="false">5</button>
                        <button type="button" data-size="6" aria-pressed="false">6</button>
                    </div>
                </section>
                <section class="panel-section">
                    <div class="section-heading">
                        <h2><label for="assembly">組み立て</label></h2>
                        <output id="progress-value" for="assembly">0%</output>
                    </div>
                    <input id="assembly" class="timeline" type="range" min="0" max="1000" value="0">
                    <div class="range-labels" aria-hidden="true"><span>分解</span><span>合体</span></div>
                </section>
                <section class="panel-section">
                    <h2 id="inspect-title">ピースを確認</h2>
                    <p class="panel-note" id="inspect-note" role="status">合体すると、ピースを横に引き出せます。</p>
                    <div class="choices piece-choices" id="pieces" role="group" aria-labelledby="inspect-title" aria-describedby="inspect-note">
                        <button type="button" data-piece="0" aria-label="ピース 1" aria-pressed="false" disabled><i></i>1</button>
                        <button type="button" data-piece="1" aria-label="ピース 2" aria-pressed="false" disabled><i></i>2</button>
                        <button type="button" data-piece="2" aria-label="ピース 3" aria-pressed="false" disabled><i></i>3</button>
                        <button type="button" data-piece="3" aria-label="ピース 4" aria-pressed="false" disabled><i></i>4</button>
                        <button type="button" data-piece="4" aria-label="ピース 5" aria-pressed="false" disabled><i></i>5</button>
                        <button type="button" data-piece="5" aria-label="ピース 6" aria-pressed="false" disabled><i></i>6</button>
                    </div>
                    <div class="inspect-actions">
                        <button class="quiet-button" id="return-piece" type="button" disabled>元に戻す</button>
                        <button class="quiet-button" id="next-piece" type="button" disabled>次のピース</button>
                    </div>
                </section>
            </aside>
        </div>

        <section class="result" aria-label="平方数の和の公式">
            <div class="result-cell math-cell">
                <h2>平方数の和</h2>
                <div class="formula" role="math" aria-label="1 の二乗から n の二乗の和は n かける n プラス 1 かける 2 n プラス 1 割る 6">
                    <span aria-hidden="true">1<sup>2</sup> + 2<sup>2</sup> + ⋯ + <var>n</var><sup>2</sup> =</span>
                    <span class="fraction" aria-hidden="true"><span><var>n</var>(<var>n</var> + 1)(2<var>n</var> + 1)</span><span>6</span></span>
                </div>
            </div>
            <div class="result-cell"><h2>直方体の寸法</h2><p id="dimensions">3 × 4 × 7</p></div>
            <div class="result-cell"><h2>1ピースの立方体数</h2><p id="cube-count">14 <small>個</small></p></div>
        </section>
    </main>
</body>
</html>
