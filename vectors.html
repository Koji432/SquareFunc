<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>３次元のベクトルの合成</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script defer src="scene.js"></script>
    <script defer src="vectors.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <nav aria-label="教材">
                <a href="index.html">平方数の和</a>
                <a href="vectors.html" aria-current="page">３次元のベクトルの合成</a>
            </nav>
        </div>
    </header>

    <main class="shell">
        <div class="page-heading">
            <h1>３次元のベクトルの合成</h1>
        </div>
        <div class="workspace">
            <section class="stage" aria-labelledby="view-title">
                <header class="stage-header">
                    <h2 id="view-title"><span class="view-icon" aria-hidden="true"></span>3Dビュー</h2>
                    <div class="stage-actions">
                        <button class="quiet-button" id="reset-view" type="button">視点を戻す</button>
                        <button class="quiet-button" id="expand-view" type="button" aria-controls="expanded-view" aria-expanded="false" hidden>拡大表示</button>
                    </div>
                </header>
                <div class="viewport" id="viewport" aria-label="3次元座標とベクトルの3Dモデル">
                    <p class="scene-message" id="scene-message" role="status">3Dモデルを読み込み中</p>
                </div>
                <footer class="stage-footer">
                    <span class="view-state" id="view-state" role="status">原点から表示</span>
                    <span class="view-hint">ドラッグで回転 · スクロール／ピンチで拡大</span>
                </footer>
            </section>

            <aside class="panel" aria-label="ベクトルの操作">
                <section class="panel-section">
                    <div class="section-heading">
                        <h2 id="components-title">成分</h2>
                        <button class="quiet-button" id="reset-values" type="button">初期値</button>
                    </div>
                    <div class="coordinate-grid" role="group" aria-labelledby="components-title">
                        <span></span><span>x</span><span>y</span><span>z</span>
                        <strong class="vector-a">A</strong>
                        <input type="number" min="-5" max="5" step="1" value="4" id="ax" aria-label="A の x 成分">
                        <input type="number" min="-5" max="5" step="1" value="-1" id="ay" aria-label="A の y 成分">
                        <input type="number" min="-5" max="5" step="1" value="2" id="az" aria-label="A の z 成分">
                        <strong class="vector-b">B</strong>
                        <input type="number" min="-5" max="5" step="1" value="-1" id="bx" aria-label="B の x 成分">
                        <input type="number" min="-5" max="5" step="1" value="2" id="by" aria-label="B の y 成分">
                        <input type="number" min="-5" max="5" step="1" value="2" id="bz" aria-label="B の z 成分">
                    </div>
                </section>
                <section class="panel-section">
                    <h2 id="vector-step">合成の手順</h2>
                    <div class="step-choices" id="steps" role="group" aria-labelledby="vector-step">
                        <button type="button" data-step="0" aria-pressed="true">原点</button>
                        <button type="button" data-step="1" aria-pressed="false">平行移動</button>
                        <button type="button" data-step="2" aria-pressed="false">合成</button>
                    </div>
                    <button class="primary-button" id="play" type="button"><span class="play-icon" aria-hidden="true"></span><span id="play-label">再生</span></button>
                </section>
                <section class="panel-section">
                    <h2 class="vector-sum">A + B</h2>
                    <output class="vector-answer" id="vector-answer" for="ax ay az bx by bz" aria-live="polite">(3, 1, 4)</output>
                    <p class="panel-note" id="component-sums">(4 − 1, −1 + 2, 2 + 2)</p>
                </section>
            </aside>
        </div>
    </main>
    <dialog class="expanded-view" id="expanded-view" aria-label="3Dビューの拡大表示"></dialog>
</body>
</html>
